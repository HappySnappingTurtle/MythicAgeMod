plugins {
    id 'base'
}

subprojects {
    apply plugin: 'java'

    group = mod_group_id
    version = mod_version

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    repositories {
        mavenCentral()
    }
}

// 源码卫生检查定义在 core 子工程中（它拥有 devtools 源集），根工程的 check 也触发它。
tasks.named('check') {
    dependsOn ':core:checkSourceHygiene'
}
