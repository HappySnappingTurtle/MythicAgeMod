pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

rootProject.name = 'MythicAgeMod'

// core：纯 Java 领域逻辑，零 Minecraft 依赖；neoforge：加载器适配层。
include 'core', 'neoforge'
