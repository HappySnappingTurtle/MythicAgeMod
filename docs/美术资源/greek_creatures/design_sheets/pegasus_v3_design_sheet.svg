<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg { fill: #f5f0e8; }
      .panel { fill: #fffdf8; stroke: #879099; stroke-width: 3; }
      .label { font-family: Arial, sans-serif; font-size: 24px; fill: #222831; }
      .small { font-family: Arial, sans-serif; font-size: 18px; fill: #333b44; }
      .note { font-family: Arial, sans-serif; font-size: 20px; fill: #1f2933; }
      .line { stroke: #25313b; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #5f6b73; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .horse { fill: #f8f8f1; stroke: #25313b; stroke-width: 5; }
      .shade { fill: #d4d9dc; stroke: #5f6b73; stroke-width: 3; }
      .mane { fill: #e4e7e8; stroke: #5f6b73; stroke-width: 3; }
      .wing { fill: #fbfbf7; stroke: #25313b; stroke-width: 4; }
      .feather { fill: #edf0f0; stroke: #6f7a82; stroke-width: 2.5; }
      .eye { fill: #20242a; }
      .reject { fill: #fff0f0; stroke: #a93b3b; stroke-width: 3; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1600" height="1000"/>
  <text class="label" x="50" y="55">Pegasus V3 technical design sheet - modeling reference, not a finished render</text>

  <rect class="panel" x="50" y="90" width="980" height="470"/>
  <text class="label" x="80" y="130">Side view: horse silhouette first</text>
  <line class="thin" x1="100" y1="520" x2="985" y2="520"/>
  <rect class="horse" x="300" y="330" width="390" height="110" rx="8"/>
  <rect class="shade" x="315" y="330" width="95" height="110" rx="6"/>
  <rect class="shade" x="585" y="330" width="105" height="110" rx="6"/>
  <polygon class="horse" points="360,320 440,270 470,305 410,350"/>
  <polygon class="horse" points="430,270 520,235 585,260 545,305 470,305"/>
  <polygon class="horse" points="555,240 690,250 845,305 705,325"/>
  <polygon class="feather" points="675,320 845,305 890,340 710,360"/>
  <polygon class="feather" points="655,350 835,345 880,382 695,387"/>
  <polygon class="feather" points="635,380 790,390 840,430 660,420"/>
  <polygon class="horse" points="255,305 320,300 320,342 250,350"/>
  <polygon class="horse" points="205,295 255,305 250,350 198,345"/>
  <polygon class="horse" points="188,300 205,295 198,345 178,348"/>
  <polygon class="horse" points="250,290 264,260 275,296"/>
  <polygon class="horse" points="286,300 303,268 310,310"/>
  <circle class="eye" cx="228" cy="314" r="5"/>
  <rect class="eye" x="178" y="326" width="9" height="5"/>
  <line class="thin" x1="202" y1="342" x2="236" y2="344"/>
  <polygon class="mane" points="335,305 360,288 410,340 390,352 360,330"/>
  <rect class="horse" x="345" y="435" width="45" height="85"/>
  <rect class="horse" x="610" y="435" width="45" height="85"/>
  <rect class="shade" x="340" y="508" width="55" height="25"/>
  <rect class="shade" x="605" y="508" width="55" height="25"/>
  <polygon class="mane" points="690,350 790,330 760,380 690,405"/>
  <rect class="reject" x="455" y="300" width="125" height="32" rx="4"/>
  <text class="small" x="462" y="323">rider space</text>
  <line class="thin" x1="300" y1="545" x2="690" y2="545"/>
  <text class="small" x="380" y="575">barrel length must stay horse-like</text>
  <line class="thin" x1="190" y1="250" x2="315" y2="250"/>
  <text class="small" x="170" y="235">small elongated head</text>
  <line class="thin" x1="350" y1="245" x2="438" y2="245"/>
  <text class="small" x="350" y="225">sloped neck from withers</text>

  <rect class="panel" x="1070" y="90" width="480" height="470"/>
  <text class="label" x="1100" y="130">Front view</text>
  <line class="thin" x1="1110" y1="520" x2="1515" y2="520"/>
  <rect class="horse" x="1240" y="330" width="150" height="112" rx="8"/>
  <polygon class="horse" points="1265,326 1300,238 1330,238 1365,326"/>
  <polygon class="horse" points="1285,240 1295,205 1308,242"/>
  <polygon class="horse" points="1332,240 1345,205 1355,244"/>
  <circle class="eye" cx="1300" cy="275" r="5"/>
  <circle class="eye" cx="1332" cy="275" r="5"/>
  <rect class="shade" x="1292" y="305" width="48" height="20"/>
  <polygon class="wing" points="1240,342 1105,345 1130,388 1240,385"/>
  <polygon class="wing" points="1390,342 1525,345 1500,388 1390,385"/>
  <rect class="horse" x="1262" y="442" width="38" height="78"/>
  <rect class="horse" x="1330" y="442" width="38" height="78"/>
  <text class="small" x="1100" y="470">wings attach behind shoulders</text>
  <text class="small" x="1280" y="555">narrow chest, visible eyes</text>

  <rect class="panel" x="50" y="600" width="700" height="330"/>
  <text class="label" x="80" y="640">45 degree view: head, neck, wings, rider space all readable</text>
  <line class="thin" x1="95" y1="885" x2="710" y2="885"/>
  <polygon class="horse" points="240,740 540,715 625,790 310,825"/>
  <polygon class="shade" points="240,740 340,730 400,810 310,825"/>
  <polygon class="horse" points="270,728 340,650 385,682 335,762"/>
  <polygon class="horse" points="315,640 390,620 438,650 372,692"/>
  <polygon class="horse" points="268,632 318,642 310,682 255,675"/>
  <circle class="eye" cx="287" cy="650" r="5"/>
  <polygon class="wing" points="420,690 560,610 700,645 525,735"/>
  <polygon class="feather" points="520,735 700,645 720,680 545,765"/>
  <polygon class="feather" points="500,765 690,700 705,735 530,795"/>
  <rect class="reject" x="410" y="690" width="125" height="30" rx="4"/>
  <text class="small" x="418" y="712">rider space</text>
  <rect class="horse" x="310" y="815" width="40" height="70"/>
  <rect class="horse" x="545" y="805" width="40" height="80"/>
  <polygon class="mane" points="555,735 650,710 635,755 565,790"/>

  <rect class="panel" x="790" y="600" width="760" height="330"/>
  <text class="label" x="820" y="640">Design approval conditions</text>
  <text class="note" x="830" y="685">1. Side view must read as a white horse before it reads as a winged unit.</text>
  <text class="note" x="830" y="725">2. Head is elongated and smaller than the chest, never a toy-like cube.</text>
  <text class="note" x="830" y="765">3. Neck slopes forward from the withers; no vertical tower neck.</text>
  <text class="note" x="830" y="805">4. Wings have shoulder, upper wing, coverts, and distinct primary feathers.</text>
  <text class="note" x="830" y="845">5. Pure white texture still needs grey planes, eye, nostril, mouth, mane, hoof detail.</text>
  <text class="note" x="830" y="885">6. Rider space is centered on the back and does not hide head, neck, or wing roots.</text>
</svg>
