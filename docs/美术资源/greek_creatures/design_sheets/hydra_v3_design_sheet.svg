  <rect class="panel" x="790" y="600" width="760" height="330"/>
  <text class="label" x="820" y="640">Design approval conditions</text>
  <text class="note" x="830" y="685">1. Nine heads are the default; changing to five is a design decision before modeling.</text>
  <text class="note" x="830" y="725">2. Each neck has root, mid, tip, and overlaps a named shoulder socket.</text>
  <text class="note" x="830" y="765">3. Body is low and long; mass must not become a front-facing cube.</text>
  <text class="note" x="830" y="805">4. Each head has eyes, jaw split, mouth line, fang, and crest or poison gland.</text>
  <text class="note" x="830" y="845">5. 45 degree view must show staggered heads, not a single block wall.</text>
  <text class="note" x="830" y="885">6. Animation must preserve neck-root and head-neck contact in all frames.</text>
